{% extends 'base.html' %}
{% block title %}Post Detail{% endblock %}
{% block content %}

<div id="post">
    <p>Loading details...</p>
</div>

<div class="add-comment">
    <form id="comment-form">
        <textarea 
            id="comment-content"
            placeholder="Write your comment here..."
            required>
        </textarea>
        <button type="submit">Submit Comment</button>
    </form>
</div>

<div id="comments">
    <h3>Comments</h3>
    <p>Loading comments...</p>
</div>

<script>
    let postId

    function formatDate(dateString) {
        const date = new Date(dateString);
    
        return date.toLocaleString();
    }

    async function loadPost(){
        try{
            postId = Number(window.location.pathname.split('/')[2])
            const response = await fetchWithAuth(`/api/posts/${postId}/`)
            if(!response.ok){
                throw new Error("Failed to load details")
            }
            const post = await response.json()
            const container = document.getElementById('post')
            container.innerHTML = `
                <article class="post-detail">
                    <h1>${post.title}</h1>
                    <p>${post.content}</p>
                    <div class="post-info">
                        <span>Author: ${post.author_username}</span>
                        <span>${formatDate(post.created_at)}</span>
                    </div>
                </article>
                <a href="/" class="btn">Back to Home</a>
            `
            loadComments(postId)
        }
        catch (error){
            document.getElementById('post').innerHTML = '<p>Failed to load detail</p>'
        }
    }


    async function loadComments(postId){ 
    try{ 
        const response = await fetchWithAuth('/api/comments/')

        if(!response.ok){ 
            throw new Error("Failed to load comments.")
        }

        const comments = await response.json()
        console.log("Comments:", comments)

        const postComments = comments.filter(
            comment => comment.post === postId
        )

        const container = document.getElementById('comments')

        container.innerHTML = '<h2>Comments</h2>'

        if(postComments.length === 0){ 
            container.innerHTML += '<p>No comments yet on this post</p>'
            return
        }

        postComments.forEach(comment => { 
            const commentElement = document.createElement('div')

            commentElement.className = 'comment'

            commentElement.innerHTML = ` 
                <div class="comment-header"> 
                    <strong>${comment.author_name}</strong> 
                </div> 
                <p>${comment.content}</p> 
                <small>${formatDate(comment.created_at)}</small> 
            `

            container.appendChild(commentElement)
        })
    } 
    catch (error){ 
        document.getElementById('comments').innerHTML =  
            '<h2>Comments</h2><p>Failed to load comments</p>'

        console.error(error)
    } 
}
    // loadPost()

    const commentForm = document.getElementById('comment-form')
    commentForm.addEventListener('submit', async function(event){
        event.preventDefault()
        const content = document.getElementById('comment-content').value.trim()
        if(!content) return

        try{
            const response = await fetchWithAuth('/api/comments/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    content: content, 
                    post: postId
                })
            })
            if(!response.ok){
                throw new Error("Failed to add Comment")
            }
            const comment = await response.json()
            console.log('Comment Added:', comment)
            commentForm.reset()
            loadComments(postId)
        }
        catch (error){
            console.error(error)
        }
    })

    window.addEventListener('DOMContentLoaded', () => {
    loadPost();
    });
</script>
{% endblock %}
