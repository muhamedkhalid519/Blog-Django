{% extends 'base.html' %}

{% block title %}Profile{% endblock %}

{% block content %}

<h1>My Profile</h1>

<div class="profile-container">

    <div class="profile-card">

        <div class="profile-header">

            <div class="profile-avatar">
                <span id="avatar"></span>
            </div>

            <div class="profile-info">

                <!-- Profile Display -->
                <div id="profile-display">
                    <h1 id="username">Loading...</h1>
                    <p id="full-name"></p>
                    <p id="email"></p>
                </div>

                <!-- Profile Edit -->
                <div id="profile-edit" style="display: none;">

                    <div class="form-group">
                        <label for="edit-username">Username</label>
                        <input type="text" id="edit-username">
                    </div>

                    <div class="form-group">
                        <label for="edit-first-name">First Name</label>
                        <input type="text" id="edit-first-name">
                    </div>

                    <div class="form-group">
                        <label for="edit-last-name">Last Name</label>
                        <input type="text" id="edit-last-name">
                    </div>

                    <div class="form-group">
                        <label for="edit-email">Email</label>
                        <input type="email" id="edit-email">
                    </div>

                </div>

            </div>

        </div>

        <!-- Profile Actions -->
        <div class="profile-actions">

            <button id="edit-profile-btn" class="btn">
                Edit Profile
            </button>

            <button id="save-profile-btn" class="btn" style="display: none;">
                Save Changes
            </button>

            <button id="cancel-edit-btn" class="btn" style="display: none;">
                Cancel
            </button>

        </div>

    </div>


    <!-- My Posts -->
    <div class="user-posts">

        <h2>My Posts</h2>

        <div id="posts">
            <p>Loading...</p>
        </div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script>

    let currentUser = null;


    async function loadProfile() {

        try {

            // Get current user
            const userResponse = await fetchWithAuth('/api/auth/me/');

            if (!userResponse.ok) {
                throw new Error("Failed to load profile");
            }

            currentUser = await userResponse.json();


            // Display user information
            document.getElementById('username').textContent =
                `@${currentUser.username}`;

            document.getElementById('full-name').textContent =
                `${currentUser.first_name} ${currentUser.last_name}`;

            document.getElementById('email').textContent =
                currentUser.email;

            document.getElementById('avatar').textContent =
                currentUser.first_name.charAt(0).toUpperCase();


            // Get posts
            const postsResponse = await fetchWithAuth('/api/posts/');

            if (!postsResponse.ok) {
                throw new Error("Failed to load posts");
            }

            const data = await postsResponse.json();

            const posts = data.results || data;


            // Filter current user's posts
            const myPosts = posts.filter(post =>
                post.author === currentUser.id
            );


            const postsContainer = document.getElementById('posts');


            // No posts
            if (myPosts.length === 0) {

                postsContainer.innerHTML = `
                    <p>You haven't created any posts yet.</p>
                `;

                return;
            }


            // Display posts
            postsContainer.innerHTML = myPosts.map(post => `
                <div class="post-card">

                    <h2>${post.title}</h2>

                    <div class="post-meta">
                        ${new Date(post.created_at).toLocaleDateString()}
                    </div>

                    <p>${post.content}</p>

                    <div class="post-actions">

                        <a href="/post/${post.id}/" class="btn">
                            View Post
                        </a>

                        <a href="/edit-post/${post.id}/" class="btn">
                            Edit
                        </a>

                        <button
                            class="btn delete-btn"
                            onclick="deletePost(${post.id})">
                            Delete
                        </button>

                    </div>

                </div>
            `).join('');

        }


        catch (error) {

            console.error(error);

            document.getElementById('username').textContent =
                'Failed to load profile';

            document.getElementById('posts').innerHTML = `
                <p>Failed to load posts.</p>
            `;

        }

    }

    async function deletePost(postId) {

        const confirmed = confirm(
            'Are you sure you want to delete this post?'
        );

        if (!confirmed) {
            return;
        }

        try {

            const response = await fetchWithAuth(`/api/posts/${postId}/`, {
                method: 'DELETE'
            });

            const data = await response.json();

            if (!response.ok) {
                console.error(data);
                alert('Failed to delete post.');
                return;
            }

            alert('Post deleted successfully.');

            loadProfile();

        } catch (error) {

            console.error(error);
            alert('Something went wrong.');

        }
    }


    function enableEditMode(user) {

        document.getElementById('profile-display').style.display = 'none';

        document.getElementById('profile-edit').style.display = 'block';


        document.getElementById('edit-username').value =
            user.username;

        document.getElementById('edit-first-name').value =
            user.first_name;

        document.getElementById('edit-last-name').value =
            user.last_name;

        document.getElementById('edit-email').value =
            user.email;


        document.getElementById('edit-profile-btn').style.display =
            'none';

        document.getElementById('save-profile-btn').style.display =
            'inline-block';

        document.getElementById('cancel-edit-btn').style.display =
            'inline-block';

    }

    async function updateProfile() {

        const updatedData = {
            username: document.getElementById('edit-username').value,
            first_name: document.getElementById('edit-first-name').value,
            last_name: document.getElementById('edit-last-name').value,
            email: document.getElementById('edit-email').value
        };

        try {

            const response = await fetchWithAuth('/api/auth/me/', {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedData)
            });

            const data = await response.json();

            if (!response.ok) {
                console.error(data);
                throw new Error("Failed to update profile");
            }

            // Update current user
            currentUser = data.user;

            // Update displayed information
            document.getElementById('username').textContent =
                `@${currentUser.username}`;

            document.getElementById('full-name').textContent =
                `${currentUser.first_name} ${currentUser.last_name}`;

            document.getElementById('email').textContent =
                currentUser.email;

            document.getElementById('avatar').textContent =
                currentUser.first_name.charAt(0).toUpperCase();

            // Return to display mode
            document.getElementById('profile-display').style.display =
                'block';

            document.getElementById('profile-edit').style.display =
                'none';

            document.getElementById('edit-profile-btn').style.display =
                'inline-block';

            document.getElementById('save-profile-btn').style.display =
                'none';

            document.getElementById('cancel-edit-btn').style.display =
                'none';

        }

        catch (error) {

            console.error(error);

            alert('Failed to update profile');

        }
    }

    function cancelEdit() {

        document.getElementById('profile-display').style.display =
            'block';

        document.getElementById('profile-edit').style.display =
            'none';

        document.getElementById('edit-profile-btn').style.display =
            'inline-block';

        document.getElementById('save-profile-btn').style.display =
            'none';

        document.getElementById('cancel-edit-btn').style.display =
            'none';

    }


    loadProfile();


    document.getElementById('edit-profile-btn')
        .addEventListener('click', () => {

            enableEditMode(currentUser);

        });

    document.getElementById('save-profile-btn')
    .addEventListener('click', () => {
        updateProfile();
    });

    document.getElementById('cancel-edit-btn')
    .addEventListener('click', () => {
        cancelEdit();
    });

</script>

{% endblock %}
